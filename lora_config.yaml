# LoRA fine-tuning config for mlx_lm
# Run with:  mlx_lm.lora --config config/lora_config.yaml
#
# Tuned as a sane starting point for a 16GB M4 MacBook Air fine-tuning a
# 3B-parameter 4-bit instruct model. If you hit memory pressure, drop
# batch_size to 2 or switch to a 1B model.

# model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
model: "./fused-model"

# --- data ---
data: "./data"            # expects train.jsonl / valid.jsonl in this folder
train: true
test: false                # set true (and add test.jsonl) once you want a held-out eval report

# --- adapter output ---
adapter_path: "./adapters"
save_every: 100             # checkpoint the adapter every N iterations

# --- training schedule ---
iters: 200
batch_size: 4
val_batches: 25
steps_per_report: 10
steps_per_eval: 100
max_seq_length: 1024

# --- optimization ---
learning_rate: 1.0e-5
grad_checkpoint: true       # trade a little speed for lower memory use

# --- LoRA shape ---
fine_tune_type: lora        # lora | dora | full
num_layers: 16              # how many transformer layers get adapters
lora_parameters:
  rank: 8
  scale: 2.0
  dropout: 0.05

seed: 42
